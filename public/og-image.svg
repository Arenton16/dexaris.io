<svg
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#14B8B8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#14B8B8" stop-opacity="0"    />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#080F0F"/>

  <!-- Radial glow centred on canvas -->
  <ellipse cx="600" cy="315" rx="480" ry="320" fill="url(#bgGlow)"/>

  <!-- Inset border frame -->
  <rect
    x="20" y="20" width="1160" height="590"
    fill="none"
    stroke="rgba(20,184,184,0.2)"
    stroke-width="1"
  />

  <!--
    D4 Rising Prism icon (source viewBox 0 0 36 34)
    Scaled to 80 px tall: factor = 80/34 = 2.3529
    Group horizontally centred alongside text.
    Icon top-left: (403, 265)
  -->
  <g transform="translate(403,265) scale(2.3529)">
    <rect x="0" y="20" width="9" height="14" fill="rgba(20,184,184,0.35)" rx="2"/>
    <rect x="12" y="10" width="9" height="24" fill="rgba(20,184,184,0.65)" rx="2"/>
    <rect x="24" y="1" width="9" height="33" fill="#14B8B8" rx="2"/>
  </g>

  <!--
    Text group x = 403 + 80 + 24 = 507
    DEXARIS centred at y = 305, subtitle centred at y = 350
  -->
  <text
    x="507"
    y="305"
    font-family="Plus Jakarta Sans, Arial, sans-serif"
    font-size="64"
    font-weight="800"
    fill="#D0F0F0"
    dominant-baseline="central"
    letter-spacing="4"
  >DEXARIS</text>

  <text
    x="510"
    y="351"
    font-family="Plus Jakarta Sans, Arial, sans-serif"
    font-size="24"
    font-weight="400"
    fill="rgba(208,240,240,0.5)"
    dominant-baseline="central"
    letter-spacing="1"
  >DeFi Yield Intelligence</text>
</svg>